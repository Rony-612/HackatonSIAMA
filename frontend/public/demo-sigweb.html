<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo de integración · Monitor de Clima + GeoTrust</title>
<!-- Maqueta del Monitor de Clima de SIGWEB (Leaflet + panel lateral) para probar la integración. NO es el sitio real. -->
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="./widget/siama-gapfill.css">
<style>
 html,body{margin:0;height:100%;font:13px system-ui,sans-serif;color:#0f1b2d}
 .shell{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr auto;height:100vh}
 aside{grid-row:1/3;background:#eef3fa;border-right:1px solid #cdd8e6;padding:12px;overflow:auto}
 aside h3{margin:6px 0;color:#1d4ed8;font-size:15px}.grp{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:12px}
 .grp label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}.grp small{color:#667085}
 #map{height:100%;min-height:380px}
 #panel{max-height:46vh;overflow:auto;border-top:2px solid #1d4ed8;background:#f6f8fb}
 .badge{display:inline-block;background:#1d4ed8;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:6px}
</style></head><body>
<div class="shell">
 <aside>
  <h3>Monitor de Clima</h3>
  <div class="grp">
   <label><input type="radio" name="m" value="" checked> Temperatura (SIAMA)</label>
   <label><input type="radio" name="m" value="p"> Precipitación (SIAMA)</label>
   <hr>
   <label><input type="radio" name="m" value="tmax"> Máxima sin huecos <span class="badge">GeoTrust</span></label>
   <label><input type="radio" name="m" value="tmin"> Mínima sin huecos <span class="badge">GeoTrust</span></label>
   <label><input type="radio" name="m" value="precipitacion"> Precipitación sin huecos <span class="badge">GeoTrust</span></label>
   <small>Borde sólido = observado · punteado = estimado</small>
  </div>
  <div class="grp"><b>Día</b><br><input id="f" type="date" style="width:100%;margin-top:6px"></div>
  <h3>Capas base</h3>
  <div class="grp"><label><input type="checkbox" checked> Cuencas</label><label><input type="checkbox" checked> Acuíferos</label><label><input type="checkbox"> Municipios</label></div>
 </aside>
 <div id="map"></div>
 <div id="panel" hidden></div>
</div>
<script src="./vendor/leaflet/leaflet.js"></script>
<script src="./widget/siama-gapfill.js"></script>
<script>
 const q = new URLSearchParams(location.search), API = q.get('api') || ''
 const map = L.map('map').setView([20.95, -101.2], 8)
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map)
 let gt = null, panel = null
 const showPanel = (clave, variable) => {
   const el = document.getElementById('panel'); el.hidden = false
   if (panel) panel.unmount()
   panel = SiamaGapfill.mount(el, { apiBase: API, mode: variable === 'precipitacion' ? 'precip' : 'temp', station: clave, variable })
 }
 document.querySelectorAll('input[name=m]').forEach((r) => r.addEventListener('change', () => {
   const v = r.value
   if (!['tmax', 'tmin', 'precipitacion'].includes(v)) { if (gt) { gt.remove(); gt = null } return }
   if (!gt) gt = SiamaGapfill.addToLeafletMap(map, { apiBase: API, variable: v, onSelect: showPanel, onError: (e) => alert('API: ' + e.message) })
   else gt.setVariable(v)
 }))
 document.getElementById('f').addEventListener('change', (e) => gt && e.target.value && gt.setDate(e.target.value))
</script></body></html>
